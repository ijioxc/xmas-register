<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聖誕晚會素材下載</title>
<style>
:root{--wine:#4a1220;--gold:#d9b47a;--paper:#faf8f2;--ink:#221511;--muted:#6b625a;--line:#e2dccd}
*{box-sizing:border-box}
html,body{overflow-x:hidden}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 "PingFang TC","Noto Sans TC",sans-serif}
main{max-width:720px;margin:auto;padding:18px 16px 28px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);margin:0}
h1{font:600 22px/1.3 "Songti TC",serif;margin:2px 0 14px}
.label{display:flex;align-items:baseline;gap:8px;margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--gold);font-weight:600}
.label b{font-size:15px;letter-spacing:.04em;color:#fff}
.post{background:var(--wine);border-radius:14px;padding:12px 12px 14px;color:#fff}
.pages{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.page{display:flex;flex-direction:column}
.page video,.page img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block;background:#191511}
.page .no{font-size:12px;color:var(--gold);margin:6px 0 0;letter-spacing:.06em}
.page h2{font-size:14px;margin:0;font-weight:600}
.page .meta{font-size:11px;color:#d8c8c0;margin:0 0 8px;flex:1}
.btn{display:block;text-align:center;text-decoration:none;font-size:13px;font-weight:600;padding:8px 6px;border-radius:7px}
.post .btn{background:var(--gold);color:var(--wine)}
.print{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center}
.print img{width:96px;aspect-ratio:426/600;object-fit:cover;border-radius:6px;display:block;box-shadow:0 2px 8px rgba(34,21,17,.18)}
.print .label{color:var(--muted);margin-bottom:2px}.print .label b{color:var(--ink)}
.print .meta{font-size:12px;color:var(--muted);margin:0 0 8px}
.print .btn{background:#284336;color:#fff}
@media(min-width:640px){h1{font-size:28px}.pages{gap:16px}.print{grid-template-columns:140px minmax(0,1fr)}.print img{width:140px}}
</style></head>
